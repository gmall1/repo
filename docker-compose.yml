services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: repo
      POSTGRES_PASSWORD: repo
      POSTGRES_DB: repo
    volumes:
      - repo-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repo"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://repo:repo@db:5432/repo
      SESSION_SECRET: change-me-in-production
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      REPO_STORAGE_PATH: /data/repos
      # Optional:
      # OPENAI_API_KEY: sk-...
      # RESEND_API_KEY: re_...
      # EMAIL_FROM: hi@yourdomain.com
    volumes:
      - repo-data:/data
    ports:
      - "3000:3000"

volumes:
  repo-pg:
  repo-data:
